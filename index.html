<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castells · Diada a la plaça</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --faixa:#000000;
  --ink:#fbf7ee;
  --muted:#c9bfae;
  --pedra:#d9c29a;
  --groc:#f4c20d;
  --vermell:#c8102e;
  --colla:#2e8b3e;
  --panel:rgba(12,10,8,.9);
  --ok:#5fbf6a;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#fbf7ee; --panel:rgba(12,10,8,.9); } }
:root[data-theme="dark"]{ --ink:#fbf7ee; --panel:rgba(12,10,8,.9); }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--groc);outline-offset:3px}

/* HUD: la faixa */
#hud{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);pointer-events:none;z-index:5}
.faixa{background:var(--faixa);padding:10px 16px 10px;border-bottom:4px solid var(--colla);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
#hCastell{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:900;font-size:26px;line-height:1;letter-spacing:.2px}
#hPts{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:700;font-size:24px;text-align:right;font-variant-numeric:tabular-nums}
#hRonda{font-size:13px;color:var(--muted)}
#hMsg{font-size:13px;color:var(--muted);text-align:right}

/* joystick = vista zenital de la pinya */
/* nivel: lectura del equilibrio, lejos del pulgar */
#level{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 78px);width:118px;height:118px;z-index:6;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,.28) 0 30%,rgba(0,0,0,.45) 31% 100%)}
#level svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--groc);box-shadow:0 0 0 3px #000;left:50%;top:50%}
#level.warn{animation:warn .5s ease-in-out infinite alternate}
@keyframes warn{to{box-shadow:0 0 0 6px rgba(255,77,77,.55)}}
/* joystick flotante: aparece donde pones el pulgar */
#stick{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.22);pointer-events:none;z-index:6}
#knob{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);left:50%;top:50%;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#zoneHint{position:fixed;left:0;right:140px;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:#fff;z-index:5;pointer-events:none;
  text-shadow:0 1px 4px #000;opacity:.85}
@media (prefers-reduced-motion: reduce){#level.warn{animation:none;box-shadow:0 0 0 5px rgba(255,77,77,.55)}}

#actions{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:12px;z-index:6}
#btnAleta{position:relative;width:104px;height:104px;border-radius:50%;
  background:repeating-linear-gradient(90deg,var(--groc) 0 11.5px,var(--vermell) 11.5px 23px);
  box-shadow:0 0 0 4px #000,0 6px 24px rgba(0,0,0,.5)}
#btnAleta span{position:relative;z-index:2;background:#000;color:#fff;padding:5px 10px;border-radius:4px;font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:22px}
#aRing{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:4px solid #fff;pointer-events:none;z-index:3}
#aRing.zone{border-color:var(--ok)}
.chip{background:rgba(0,0,0,.72);border:1.5px solid rgba(255,255,255,.5);padding:10px 14px;border-radius:999px;font-weight:600;font-size:14px}
#topBtns{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;gap:8px;z-index:6}
#topBtns button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);font-size:17px}

/* sello de resultado */
#stamp{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-6deg) scale(.6);opacity:0;z-index:7;pointer-events:none;
  font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:clamp(46px,13vw,104px);line-height:.9;text-align:center;
  padding:10px 22px;border:6px solid currentColor;border-radius:8px;background:rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#stamp.show{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}
#stamp small{display:block;font-size:.32em;font-weight:700;margin-top:6px}

/* pantallas */
#screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow:auto;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
#screen:empty{display:none}
#screen.dim{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.8) 55%)}
.wrap{width:100%;max-width:560px;margin:0 auto}
.title{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:900;font-size:clamp(76px,25vw,176px);line-height:.82;margin:0;letter-spacing:-1px;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.motto{font-size:17px;margin:14px 0 0;color:var(--ink);max-width:30ch}
.lead{color:var(--muted);font-size:15px;line-height:1.5;max-width:60ch}
h2{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:40px;line-height:1;margin:0 0 6px}
h3{font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:24px;margin:22px 0 6px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.b1{background:var(--groc);color:#000;font-weight:700;font-size:17px;padding:16px 18px;border-radius:10px;text-align:left}
.b2{border:1.5px solid rgba(255,255,255,.55);font-weight:600;font-size:16px;padding:14px 18px;border-radius:10px;text-align:left;background:rgba(0,0,0,.45)}
.spacer{flex:1;min-height:30vh}
.panel{background:var(--panel);border-radius:14px;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.colles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.colla{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);border:2px solid transparent}
.colla[aria-pressed="true"]{border-color:var(--groc)}
.sw{height:34px;border-radius:6px;position:relative;overflow:hidden}
.sw::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:#000}
.colla b{font-size:14px;line-height:1.25}
.toggle{display:flex;gap:8px;margin-top:14px}
.toggle button{flex:1;padding:10px;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);font-size:14px}
.toggle button[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff;font-weight:700}
.glist{margin-top:6px}
.cs{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.12)}
.cs:disabled{opacity:.35}
.cs .nm{font-weight:600;font-size:15px}
.cs .cd{font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:20px;text-align:right}
.cs .pt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.diff{display:flex;gap:3px;justify-content:flex-end;align-items:center}
.diff i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}
.diff i.on{background:var(--groc)}
.res{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:56px;line-height:1;margin:6px 0}
table.sum{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
table.sum td{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12)}
table.sum td:last-child{text-align:right;font-weight:700}
.dim-t{color:var(--muted)}
.guide p,.guide li{color:#e9e1d2;line-height:1.55;font-size:15px}
.guide ul{padding-left:18px}
.guide b{color:#fff}
.back{align-self:flex-start;padding:8px 0;color:var(--muted);font-size:15px}
@media (prefers-reduced-motion: reduce){#stamp{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Plaça castellera en 3D"></canvas>

<div id="hud" class="hidden">
  <div class="faixa">
    <div id="hCastell">—</div><div id="hPts"></div>
    <div id="hRonda"></div><div id="hMsg"></div>
  </div>
</div>
<div id="topBtns" class="hidden">
  <button id="btnMute" aria-label="Silenciar música">♪</button>
  <button id="btnQuit" aria-label="Salir al menú">✕</button>
</div>

<div id="level" class="hidden" aria-label="Inclinació del castell">
  <svg viewBox="0 0 118 118" aria-hidden="true">
    <circle cx="59" cy="59" r="55" fill="none" stroke="#c8102e" stroke-width="4" stroke-dasharray="6 5"/>
    <circle cx="59" cy="59" r="38" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
    <circle cx="59" cy="59" r="13" fill="rgba(255,255,255,.14)"/>
    <line id="push" x1="59" y1="59" x2="59" y2="59" stroke="#5fbf6a" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/>
    <defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#5fbf6a"/></marker></defs>
  </svg>
  <div id="dot"></div>
</div>
<div id="stick" class="hidden"><div id="knob"></div></div>
<div id="zoneHint" class="hidden">Posa el polze a qualsevol lloc de la meitat inferior</div>

<div id="actions" class="hidden">
  <button id="btnAleta" class="hidden" aria-label="Hacer la aleta"><div id="aRing"></div><span>Aleta!</span></button>
  <button id="btnDesm" class="chip hidden">Desmuntar</button>
</div>

<div id="stamp"></div>
<div id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const fmt = n => n.toLocaleString('es-ES');

/* ================= DATOS ================= */
// Taula de puntuacions del XXX Concurs de Castells (2026): [id, n, pisos, estructura, carregat, descarregat]
const RAW = [
 ['Pd5',1,5,'',260,315],['2d6',2,6,'',250,300],['9d6',9,6,'',295,355],['4d7',4,7,'',325,395],['3d7',3,7,'',345,415],
 ['4d7a',4,7,'a',465,515],['9d7',9,7,'',615,740],['2d7',2,7,'',670,805],['4d8',4,8,'',700,845],['Pd6',1,6,'',765,920],
 ['3d8',3,8,'',805,970],['7d8',7,8,'',905,1090],['2d8f',2,8,'f',1005,1210],['Pd7f',1,7,'f',1055,1270],['5d8',5,8,'',1150,1385],
 ['3d8a',3,8,'a',1375,1530],['7d8a',7,8,'a',1475,1635],['5d8a',5,8,'a',1555,1730],['4d9f',4,9,'f',1510,1820],['3d9f',3,9,'f',1585,1910],
 ['9d8',9,8,'',1980,2385],['2d9fm',2,9,'fm',2265,2730],['Pd8fm',1,8,'fm',2380,2870],['7d9f',7,9,'f',2500,3010],['5d9f',5,9,'f',2595,3125],
 ['4d9fa',4,9,'fa',2955,3285],['3d9fa',3,9,'fa',3100,3445],['4d9sf',4,9,'',3405,4105],['2d8sf',2,8,'',3575,4310],['3d10fm',3,10,'fm',3755,4525],
 ['4d10fm',4,10,'fm',4095,4930],['9d9f',9,9,'f',4295,5180],['2d9sm',2,9,'f',4685,5645],['Pd9fmp',1,9,'fmp',4920,5925],['3d9sf',3,9,'',5165,6220],
 ['Pd7sf',1,7,'',5280,6360],['2d10fmp',2,10,'fmp',5630,6780],['4d10sm',4,10,'f',5910,7120],['3d10sm',3,10,'f',6205,7475]
];
const NUM = {1:'Pilar',2:'Dos',3:'Tres',4:'Quatre',5:'Cinc',6:'sis',7:'Set',8:'vuit',9:'Nou',10:'deu'};
const PIS = {5:'cinc',6:'sis',7:'set',8:'vuit',9:'nou',10:'deu'};
function catName(id,n,p,fl){
  let s = (n===1?'Pilar':NUM[n]) + ' de ' + PIS[p];
  if (fl.includes('a')) s += " amb l'agulla";
  if (id.includes('sf')) s += ' sense folre';
  else if (id.includes('sm')) s += ' amb folre sense manilles';
  else if (fl.includes('f')) s += ' amb folre' + (fl.includes('m') ? (fl.includes('p') ? ', manilles i puntals' : ' i manilles') : '');
  return s;
}
const CASTELLS = RAW.map(([id,n,p,fl,C,D]) => ({id,n,pisos:p,flags:fl,C,D,name:catName(id,n,p,fl),
  diff: 0.55 + Math.log2(D/300)*0.38})).sort((a,b)=>a.D-b.D);
const byId = id => CASTELLS.find(c=>c.id===id);

const COLLES = [
  {id:'vila', name:'Castellers de Vilafranca', color:'#2f8a3e'},
  {id:'vella',name:'Colla Vella dels Xiquets de Valls', color:'#e690ad'},
  {id:'joves',name:'Colla Joves Xiquets de Valls', color:'#c41f2e'},
  {id:'jove', name:'Colla Jove Xiquets de Tarragona', color:'#6a3b8f'},
  {id:'miny', name:'Minyons de Terrassa', color:'#a685b8'},
  {id:'capg', name:'Capgrossos de Mataró', color:'#22407e'}
];
const LVL = ['baixos','segons','terços','quarts','quints','sisens','setens','vuitens','novens'];

let store = {};
try { store = JSON.parse(localStorage.getItem('castells3d')||'{}') || {}; } catch(e) { store = {}; }
function save(){ try { localStorage.setItem('castells3d', JSON.stringify(store)); } catch(e){} }

/* ================= THREE ================= */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
const mobile = matchMedia('(pointer:coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.75 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfd9e0, 45, 120);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 400);

const hemi = new THREE.HemisphereLight(0xdbe8f5, 0x9c7a52, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d6, 1.35);
sun.position.set(14, 26, 10); sun.castShadow = true;
sun.shadow.mapSize.set(mobile?1024:2048, mobile?1024:2048);
Object.assign(sun.shadow.camera, {left:-15,right:15,top:20,bottom:-6,near:1,far:70});
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);

// cielo
(() => {
  const g = new THREE.SphereGeometry(220, 24, 12);
  const m = new THREE.ShaderMaterial({side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{top:{value:new THREE.Color('#5d93c9')}, mid:{value:new THREE.Color('#bcd6ea')}, bot:{value:new THREE.Color('#f1e3c8')}},
    vertexShader:'varying vec3 vp; void main(){ vp=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vp; void main(){ float h=normalize(vp).y; vec3 c = h>0.0 ? mix(mid,top,smoothstep(0.0,0.6,h)) : mix(mid,bot,smoothstep(0.0,-0.2,h)); gl_FragColor=vec4(c,1.0);}'});
  scene.add(new THREE.Mesh(g, m));
})();

function canvasTex(w,h,draw,rep){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const x = cv.getContext('2d'); draw(x,w,h);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep,rep); }
  return t;
}
const PLAZA = 27;
// suelo de piedra
(() => {
  const tex = canvasTex(512,512,(x,w,h)=>{
    x.fillStyle='#b9a37e'; x.fillRect(0,0,w,h);
    const rows=8; const rh=h/rows;
    for(let r=0;r<rows;r++){ let cx=(r%2)*-32; while(cx<w){ const bw=rand(48,96);
      const l=rand(-14,10); x.fillStyle=`hsl(${rand(32,40)},${rand(22,32)}%,${62+l}%)`;
      x.fillRect(cx+2,r*rh+2,bw-4,rh-4);
      for(let i=0;i<14;i++){ x.fillStyle=`rgba(80,60,40,${rand(.03,.09)})`; x.fillRect(cx+rand(2,bw-6),r*rh+rand(2,rh-6),rand(2,6),rand(2,6)); }
      cx+=bw; } }
  }, 18);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(160,160), new THREE.MeshLambertMaterial({map:tex}));
  g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g);
})();

// fachadas de la plaça
function facadeTex(wall, floors, cols, seed){
  return canvasTex(256,512,(x,w,h)=>{
    x.fillStyle=wall; x.fillRect(0,0,w,h);
    for(let i=0;i<500;i++){ x.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:200},${Math.random()<.5?0:150},.035)`; x.fillRect(rand(0,w),rand(0,h),rand(1,5),rand(1,5)); }
    const fh = h/(floors+0.35);
    // cornisa
    x.fillStyle='rgba(0,0,0,.18)'; x.fillRect(0,0,w,fh*.25);
    x.fillStyle='rgba(255,255,255,.12)'; x.fillRect(0,fh*.22,w,5);
    const cw = w/cols; const shutter = seed%3===0?'#3f6b4f':(seed%3===1?'#6a4a30':'#46647a');
    for(let f=0;f<floors;f++){
      const y0 = h - (f+1)*fh;
      for(let c=0;c<cols;c++){
        const cx = c*cw + cw*.5;
        if(f===0){ // porxo / planta baja
          x.fillStyle='#2b241d'; x.beginPath(); x.moveTo(cx-cw*.32,h); x.lineTo(cx-cw*.32,y0+fh*.45);
          x.arc(cx,y0+fh*.45,cw*.32,Math.PI,0); x.lineTo(cx+cw*.32,h); x.fill();
          continue;
        }
        const ww=cw*.42, wh=fh*.62, wy=y0+fh*.16;
        x.fillStyle='#1f1a16'; x.fillRect(cx-ww/2,wy,ww,wh);
        x.fillStyle=shutter; x.fillRect(cx-ww/2-ww*.32,wy,ww*.3,wh); x.fillRect(cx+ww/2+ww*.02,wy,ww*.3,wh);
        x.fillStyle='rgba(255,255,255,.25)'; x.fillRect(cx-ww/2-3,wy-4,ww+6,4);
        // balcón
        x.fillStyle='rgba(0,0,0,.3)'; x.fillRect(cx-ww*.85,wy+wh,ww*1.7,5);
        x.strokeStyle='#1c1c1c'; x.lineWidth=1.4;
        for(let b=0;b<=8;b++){ const bx=cx-ww*.8+b*ww*1.6/8; x.beginPath(); x.moveTo(bx,wy+wh-16); x.lineTo(bx,wy+wh); x.stroke(); }
        x.beginPath(); x.moveTo(cx-ww*.85,wy+wh-16); x.lineTo(cx+ww*.85,wy+wh-16); x.stroke();
      }
    }
  });
}
const senyeraTex = canvasTex(64,128,(x,w,h)=>{ for(let i=0;i<9;i++){ x.fillStyle = i%2? '#c8102e':'#f4c20d'; x.fillRect(i*w/9,0,w/9+1,h);} });
const WALLS = ['#d7b98c','#e4cfa6','#c99a6b','#e7d9bf','#cfae7d','#bf8f63','#e0c49a','#d9b28a'];
(() => {
  let seed=0;
  for(let side=0; side<4; side++){
    const rot = side*Math.PI/2;
    let u = -PLAZA-6;
    while(u < PLAZA+6){

/* ===== personajes: geometría low-poly fusionada con colores por vértice ===== */
const MAT = new THREE.MeshLambertMaterial({vertexColors:true});
const _c = new THREE.Color();
function part(geo, color, m){
  const g = geo.index ? geo.toNonIndexed() : geo; g.applyMatrix4(m);
  const n = g.attributes.position.count, arr = new Float32Array(n*3);
  _c.set(color).convertSRGBToLinear();
  for(let i=0;i<n;i++){ arr[i*3]=_c.r; arr[i*3+1]=_c.g; arr[i*3+2]=_c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr,3)); return g;
}
function merge(list){
  let tot=0; list.forEach(g=>tot+=g.attributes.position.count);
  const P=new Float32Array(tot*3), N=new Float32Array(tot*3), C=new Float32Array(tot*3); let o=0;
  list.forEach(g=>{ P.set(g.attributes.position.array,o*3); N.set(g.attributes.normal.array,o*3); C.set(g.attributes.color.array,o*3); o+=g.attributes.position.count; g.dispose(); });
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(P,3)); out.setAttribute('normal',new THREE.BufferAttribute(N,3)); out.setAttribute('color',new THREE.BufferAttribute(C,3));
  out.computeBoundingSphere(); return out;
}
const M = (x,y,z,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1) => new THREE.Matrix4().compose(new V3(x,y,z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)), new V3(sx,sy,sz));
const UPY = new V3(0,1,0);
function limb(L, side, dir, sleeve, skin){
  const sh = new V3(side*0.245, 1.41, 0.0), d = dir.clone().normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(UPY, d), one = new V3(1,1,1);
  L.push(part(new THREE.CylinderGeometry(0.068,0.058,0.32,6), sleeve, new THREE.Matrix4().compose(sh.clone().addScaledVector(d,0.15), q, one)));
  L.push(part(new THREE.CylinderGeometry(0.05,0.042,0.3,6), skin, new THREE.Matrix4().compose(sh.clone().addScaledVector(d,0.44), q, one)));
  const hd = sh.clone().addScaledVector(d,0.62);
  L.push(part(new THREE.SphereGeometry(0.052,6,4), skin, M(hd.x,hd.y,hd.z)));
}
const ARMS = {
  down:     s => new V3(s*0.22,-1,0.05),

const geoCache = new Map();
function personGeo(shirt, pose, o={}){
  const key = [shirt,pose,!!o.helmet,!!o.shoes,o.skin||'',o.hair||'',o.moc||''].join('|');

const A = {ctx:null, muted:false, phrase:null, queue:[], idx:0, nextT:0, beat:0.4, playing:false};
function audioInit(){
  if (A.ctx) { if (A.ctx.state==='suspended') A.ctx.resume(); return; }
  try {
    const c = A.ctx = new (window.AudioContext||window.webkitAudioContext)();
    A.master = c.createGain(); A.master.gain.value = A.muted?0:0.55; A.master.connect(c.destination);
    A.bus = c.createGain(); A.bus.connect(A.master);
    const d=c.createDelay(); d.delayTime.value=0.19; const fb=c.createGain(); fb.gain.value=0.28; const wet=c.createGain(); wet.gain.value=0.22;
    A.bus.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(A.master);
    const len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    A.noise=buf;
    setInterval(sched, 40);
  } catch(e){ A.ctx=null; }
}
function gnote(t,f,dur,vol){
  const c=A.ctx, o1=c.createOscillator(), o2=c.createOscillator(), vib=c.createOscillator(), vg=c.createGain();
  o1.type='sawtooth'; o2.type='square'; o1.frequency.value=f; o2.frequency.value=f*1.004;
  vib.frequency.value=5.4; vg.gain.value=f*0.007; vib.connect(vg); vg.connect(o1.frequency); vg.connect(o2.frequency);
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=0.8;
  const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=380;
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.025);
  g.gain.setValueAtTime(vol*.85,t+dur*.82); g.gain.linearRampToValueAtTime(0,t+dur);
  const g2=c.createGain(); g2.gain.value=0.45;
  o1.connect(bp); o2.connect(g2); g2.connect(bp); bp.connect(hp); hp.connect(g); g.connect(A.bus);
  [o1,o2,vib].forEach(o=>{o.start(t); o.stop(t+dur+0.05);});
}
function noiseHit(t,freq,dur,vol,type='lowpass'){
  if(!A.ctx) return; const c=A.ctx, s=c.createBufferSource(); s.buffer=A.noise;
  const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=c.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(A.bus); s.start(t, Math.random()*1.5); s.stop(t+dur+0.02);
}

const PH = {

        [2,.5],[3,.5],[5,.5],[7,.5],[9,.75],[7,.25],[5,.5],[3,.5],[5,2],[7,.5],[9,.5],[10,.5],[12,.5],[10,.75],[9,.25],[7,.5],[5,.5],[7,2]],
  aleta:[[12,.25],[10,.25],[12,.5],[14,.5],[15,1],[14,.5],[12,.5],[10,.5],[12,1.5],[15,.5],[14,.5],[12,.5],[10,.5],[9,.5],[7,1.5]],

  final:[[7,.5],[5,.5],[3,.5],[2,.5],[0,2.5]]

function playToc(name, loop=true){
  if(!A.ctx) return;
  A.phrase={notes:PH[name], loop}; A.idx=0; A.playing=true;
  A.nextT=Math.max(A.ctx.currentTime+0.05, A.nextT);
}
function stopToc(){ A.playing=false; A.phrase=null; }
function sched(){
  if(!A.ctx || !A.playing || !A.phrase) return;
  const c=A.ctx;
  while(A.nextT < c.currentTime+0.25){
    const ns=A.phrase.notes;
    if(A.idx>=ns.length){ if(A.phrase.loop) A.idx=0; else { A.playing=false; return; } }
    const [st,b]=ns[A.idx++]; const dur=b*A.beat, f=392*Math.pow(2,st/12);
    gnote(A.nextT,f,dur*.96,0.09);
    gnote(A.nextT,f*Math.pow(2,-4/12),dur*.96,0.045);
    const beatPos = (A.nextT/A.beat);
    if (b>=.5) noiseHit(A.nextT,700,0.14,0.32);
    if (Math.abs(beatPos-Math.round(beatPos))<0.05 && Math.round(beatPos)%2===0) noiseHit(A.nextT,180,0.22,0.5);
    A.nextT+=dur;
  }
}

  for(let i=0;i<220;i++) noiseHit(t0+Math.random()*len, 2600+Math.random()*1800, 0.03, Math.random()*0.18, 'bandpass');
  const s=A.ctx.createBufferSource(); s.buffer=A.noise; s.loop=true; const f=A.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=700; f.Q.value=0.7;
  const g=A.ctx.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.22,t0+0.4); g.gain.linearRampToValueAtTime(0,t0+len);

  const s=c.createBufferSource(); s.buffer=A.noise; s.loop=true; const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
  f.frequency.setValueAtTime(900,t0); f.frequency.exponentialRampToValueAtTime(260,t0+1.8);
  const g=c.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.35,t0+0.15); g.gain.linearRampToValueAtTime(0,t0+2);
  s.connect(f); f.connect(g); g.connect(A.bus); s.start(t0); s.stop(t0+2.1);

/* ================= CONSTRUCCIÓN DEL CASTELL ================= */
function baseLayout(n){
  const pts=[], subs=[];
  const ring=(cnt,r,cx,cz,a0)=>{ const idx=[]; for(let i=0;i<cnt;i++){ const a=a0+i*2*Math.PI/cnt; pts.push({x:cx+Math.sin(a)*r, z:cz+Math.cos(a)*r, ry:a}); idx.push(pts.length-1);} subs.push({idx,cx,cz,size:cnt}); };
  if(n===1){ pts.push({x:0,z:0,ry:0}); subs.push({idx:[0],cx:0,cz:0,size:1}); }
  else if(n===2){ pts.push({x:-0.27,z:0,ry:Math.PI/2},{x:0.27,z:0,ry:-Math.PI/2}); subs.push({idx:[0,1],cx:0,cz:0,size:2}); }
  else if(n===3) ring(3,0.43,0,0,Math.PI);
  else if(n===4) ring(4,0.5,0,0,Math.PI/4);
  else if(n===5){ ring(3,0.43,-0.28,0,-Math.PI/2); pts.push({x:0.42,z:0.27,ry:Math.PI/2},{x:0.42,z:-0.27,ry:Math.PI/2}); subs.push({idx:[3,4],cx:0.42,cz:0,size:2}); }
  else if(n===7){ ring(4,0.5,-0.45,0,Math.PI/4); ring(3,0.43,0.52,0,Math.PI/2); }
  else if(n===9){ for(let k=0;k<3;k++){ const a=k*2*Math.PI/3; ring(3,0.4,Math.sin(a)*0.8,Math.cos(a)*0.8,a); } }
  return {pts,subs};
}

    const r=r0+k*0.5, cnt=Math.floor(2*Math.PI*r/0.5), a0=rand(0,6.28);
    for(let i=0;i<cnt;i++){
      const a=a0+i*2*Math.PI/cnt+rand(-.04,.04), sa=rand(0,6.28), sr=rand(pinyaR+3,pinyaR+9);
      items.push({g: Math.random()<0.8 ? (i%3) : 3+Math.floor(Math.random()*3),
        to:new V3(Math.sin(a)*r,0,Math.cos(a)*r), from:new V3(Math.sin(sa)*sr,0,Math.cos(sa)*sr),
        ry:a+Math.PI, rx:0.1+k*0.015, s:rand(.93,1.05), delay:k*0.14+rand(0,.35)});
    }
  }
  const counts=geos.map((_,i)=>items.filter(it=>it.g===i).length);
  const ims=geos.map((g,i)=>{ const im=new THREE.InstancedMesh(g,MAT,Math.max(1,counts[i])); im.count=counts[i]; im.castShadow=true; group.add(im); return im; });
  const fill=[0,0,0,0,0,0]; items.forEach(it=>{ it.im=ims[it.g]; it.i=fill[it.g]++; });
  // grallers
  const ga=Math.PI*0.78;
  for(let i=0;i<5;i++){
    const a=ga+(i-2)*0.13, r=pinyaR+1.4; const g=new THREE.Mesh(personGeo(shirt, i===4?'down':'gralla',{shoes:true,skin:SKINS[i%5],hair:HAIRS[i%6]}),MAT);
    g.position.set(Math.sin(a)*r,0,Math.cos(a)*r); g.rotation.y=a+Math.PI; g.castShadow=true; group.add(g);
    if(i===4){ const d=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.28,12), new THREE.MeshLambertMaterial({color:0x7a2a1a})); d.position.set(0,1.0,0.28); g.add(d); }
  }
  C = {def, colla, group, steps, all, tronc, enx, ys, yTop, pinyaR, items, ims, form:0, rT0};
  return C;
}
const dummy=new THREE.Object3D();
function updatePinya(T){
  let done=true;
  for(const it of C.items){
    const k=clamp((T-it.delay)/1.0,0,1); if(k<1) done=false;
    const e=ease(k);
    dummy.position.lerpVectors(it.from,it.to,e);
    dummy.position.y = Math.abs(Math.sin(e*Math.PI*5))*0.06*(1-e);
    dummy.rotation.set(it.rx*e, it.ry, 0, 'YXZ');
    dummy.scale.setScalar(it.s); dummy.updateMatrix(); it.im.setMatrixAt(it.i,dummy.matrix);
  }
  C.ims.forEach(im=>im.instanceMatrix.needsUpdate=true);
  return done;
}

/* ===== trayectorias ===== */
function bez(p,t,out){ const u=1-t; out.set(0,0,0)
  .addScaledVector(p[0],u*u*u).addScaledVector(p[1],3*u*u*t).addScaledVector(p[2],3*u*t*t).addScaledVector(p[3],t*t*t); return out; }
function makePath(m){
  const b=m.base, R=C.pinyaR; let d=Math.hypot(b.x,b.z), ax, az;
  if(d<0.05){ const a=rand(0,6.28); ax=Math.sin(a); az=Math.cos(a);} else { ax=b.x/d; az=b.z/d; }
  m.ax=ax; m.az=az;
  m.path=[new V3(ax*(R+0.9),0,az*(R+0.9)), new V3(ax*(R*0.55+0.5), b.y*0.4+1.8, az*(R*0.55+0.5)),
          new V3(b.x+ax*0.7, b.y+0.6, b.z+az*0.7), b.clone()];
  m.dur=(1.2+b.y*0.045);
}
function setPose(m,pose){ if(m.curPose!==pose){ m.mesh.geometry=personGeo(C.colla.color,pose,m.look); m.curPose=pose; } }

/* ================= ESTADO DEL JUEGO ================= */
const G = { state:'idle', mode:'diada', colla:COLLES[0], easy:true, stepI:0, wait:0, T:0, aleta:false, desm:false,
  results:[], ronda:1, ctrl:(store.ctrl||'dit'), desc:[], descI:0, aPhase:0, aMiss:0, fallT:0, demo:true };
const bal = {x:0,z:0,vx:0,vz:0,gx:0,gz:0};
const input = {x:0,y:0,kx:0,ky:0,tx:0,ty:0};
const deb = [];
let topY = 2;

function startCastell(def){
  audioInit();
  G.def=def; G.token=(G.token||0)+1; topY=2; buildCastell(def, G.colla);
  G.state='pinya'; G.T=0; G.stepI=0; G.wait=0; G.aleta=false; G.desm=false; G.demo=false;
  Object.assign(bal,{x:0,z:0,vx:0,vz:0,gx:0,gz:0}); deb.length=0;
  // baixos ya en la pinya
  C.all.filter(m=>m.kind==='baix').forEach(m=>{ m.placed=true; m.t=1; m.mesh.visible=true; setPose(m,m.pose); });
  $('#screen').innerHTML=''; $('#screen').className='';
  show('#hud',1); show('#level',1); show('#zoneHint',G.ctrl==='dit'); show('#stick',0); tiltZero=null; show('#actions',1); show('#topBtns',1); show('#btnAleta',0); show('#btnDesm',0);
  document.documentElement.style.setProperty('--colla', G.colla.color);

function show(sel,on){ $(sel).classList.toggle('hidden',!on); }
function msg(t){ $('#hMsg').textContent=t; }
function updPts(){ $('#hPts').textContent = G.mode==='diada' ? fmt(score(G.results).total) : fmt(G.def ? G.def.D : 0); }

function beginStep(i){
  const st=C.steps[i]; msg(st.label);
  const stg=st.mem.length>6?0.06:0.12; st.mem.forEach((m,j)=>{ makePath(m); m.t=-j*stg; m.dir=1; m.mesh.visible=true; setPose(m,'climb'); });
  if(st.enx) show('#btnDesm',0);
}
function kick(mag){ const a=rand(0,6.28), k=mag*G.def.diff*(G.easy?0.6:1); bal.vx+=Math.sin(a)*k; bal.vz+=Math.cos(a)*k; }

function startDescent(){
  // lista de pasos a deshacer (incluido el paso a medias)
  const list=[];
  for(let i=Math.min(G.stepI,C.steps.length-1); i>=0; i--){
    const mem=C.steps[i].mem.filter(m=>m.mesh.visible); if(mem.length) list.push({label:C.steps[i].label.replace('Pugen','Baixen').replace('Puja','Baixa'), mem});
  }
  G.desc=list; G.descI=0; G.state='descend'; startDescStep();
  playToc(G.aleta?'baixa':'final', G.aleta);
}
function startDescStep(){
  const st=G.desc[G.descI]; if(!st) return;
  msg(st.label);
  st.mem.forEach((m,j)=>{ if(!m.path) makePath(m); m.dir=-1; if(m.t>=1) m.t=1+j*0.1; m.placed=false; setPose(m,'climb'); });
}

function doAleta(){
  if(G.state!=='aleta') return;
  const inZone = G.aPhase>0.79 && G.aPhase<0.985;
  if(inZone){
    G.aleta=true; G.state='carregat'; G.wait=1.6; setPose(C.enx,'aleta');
    show('#btnAleta',0); msg('Carregat! Ara cal descarregar'); stamp('Carregat','#f4c20d','queda descarregar-lo');
    playToc('aleta',false); cheer(2.5); vib(40);
  } else {
    kick(0.45); G.aMiss++; msg(G.aPhase<0.79 ? 'Massa aviat: espera que el cercle tanqui' : 'Massa tard: torna-hi'); G.aPhase=0; vib(15);
  }
}
function vib(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function fall(){
  G.state='fall'; G.fallT=0; stopToc(); ohh(); vib([60,40,90]);
  show('#btnAleta',0); show('#btnDesm',0);
  const len=Math.hypot(bal.x,bal.z)||1, dx=bal.x/len, dz=bal.z/len;
  C.all.forEach(m=>{
    if(!m.mesh.visible || m.kind==='baix') return;
    const h=m.mesh.position.y; if(h<0.5) return;
    const f = m.kind==='folre'?0.4:(m.kind==='manilles'?0.7:1);
    deb.push({m, v:new V3(dx*(0.8+h*0.32)*f+rand(-.9,.9), rand(0.5,2.2), dz*(0.8+h*0.32)*f+rand(-.9,.9)),
      w:new V3(rand(-3,3),rand(-2,2),rand(-3,3)).multiplyScalar(0.7+h*0.05), rest:false});
  });
  shake=0.6;
  const res = G.aleta ? 'C' : 'i';
  const tk=G.token;
  setTimeout(()=>{ if(tk!==G.token) return; stamp(G.aleta?'Carregat':'Intent', G.aleta?'#f4c20d':'#ff5a5a', G.aleta?"l'enxaneta va fer l'aleta":'el castell ha caigut'); }, 700);
  setTimeout(()=>{ if(tk===G.token) endRound(res); }, 3600);
}

function endRound(res){
  G.state='idle';
  hideStamp(); show('#level',0); show('#zoneHint',0); show('#stick',0); stickUp(); show('#actions',0);
  const r={id:G.def.id, res}; G.results.push(r);
  if(G.mode==='diada'){ updPts(); roundScreen(r); } else practiceScreen(r);
}

/* puntuación: 3 mejores castells distintos, máximo 2 solo carregats (normativa 2026) */
function score(results){
  const best={};
  results.forEach(r=>{ if(r.res!=='D'&&r.res!=='C') return; const d=byId(r.id); const pts=r.res==='D'?d.D:d.C;
    const k=r.id+r.res; if(!best[k]||pts>best[k].pts) best[k]={id:r.id,res:r.res,pts}; });
  const byCastell={}; Object.values(best).forEach(v=>{ (byCastell[v.id]=byCastell[v.id]||[]).push(v); });
  const cand=Object.values(byCastell).map(a=>a.sort((x,y)=>y.pts-x.pts)[0]).sort((a,b)=>b.pts-a.pts);
  const chosen=[]; let nc=0;
  for(const v of cand){ if(chosen.length>=3) break; if(v.res==='C'){ if(nc>=2) continue; nc++; } chosen.push(v); }
  return {total:chosen.reduce((s,v)=>s+v.pts,0), chosen};
}
const notation = r => (r.res==='i'?'i':r.res==='id'?'id':'') + r.id + (r.res==='C'?'C':'');
const RESNAME = {D:'Descarregat',C:'Carregat',i:'Intent',id:'Intent desmuntat'};
const RESCOL = {D:'#5fbf6a',C:'#f4c20d',i:'#ff6b6b',id:'#c9bfae'};

/* ================= BUCLE PRINCIPAL ================= */
const cam={theta:0.7,phi:0.32,dist:18,ty:4,drag:null};
let shake=0;
const tmp=new V3(), qTilt=new THREE.Quaternion(), qYaw=new THREE.Quaternion(), eul=new THREE.Euler();
function sway(y){ const H=Math.max(topY,3); const k=Math.pow(clamp(y/H,0,1.2),1.6)*(0.55+H*0.03); return k; }

function step(dt){
  G.T+=dt;
  // --- pinya ---
  if(C && G.state==='pinya'){ if(updatePinya(G.T)){ G.state='climb'; G.stepI=0; beginStep(0); show('#btnDesm',1); playToc('puja'); } }
  else if(C && G.demo && C.form<1){ C.form=1; updatePinya(99); }

  // --- personajes en movimiento ---
  if(C){
    let movingDone=true; let ty=1.8;
    for(const m of C.all){
      if(!m.mesh.visible) continue;
      if(deb.length && deb.some(d=>d.m===m)) continue;
      if(m.dir===1 && m.t<1){ m.t+=dt/m.dur; if(m.t>=1){ m.t=1; m.placed=true; m.dir=0; setPose(m,m.pose); if(m.kind!=='enxaneta') kick(0.10); } else movingDone=false; }
      else if(m.dir===-1){ m.t-=dt/m.dur; if(m.t<=0){ m.t=0; m.dir=0; m.mesh.visible=false; continue; } movingDone=false; }
      const tt=clamp(m.t,0,1);
      if(tt>=1 || !m.path) tmp.copy(m.base); else bez(m.path,ease(tt),tmp);
      const sw=sway(tmp.y);
      const jit = (Math.hypot(bal.x,bal.z)**2)*0.03;
      m.mesh.position.set(tmp.x+bal.x*sw+rand(-jit,jit)*(tmp.y>1?1:0), tmp.y, tmp.z+bal.z*sw);
      const climbing = tt<1 && m.path;
      const yaw = climbing ? Math.atan2(m.ax,m.az)+Math.PI : m.ry;
      qYaw.setFromAxisAngle(UPY,yaw);
      const tk=0.16*clamp(tmp.y/Math.max(topY,3),0,1);
      eul.set(bal.z*tk,0,-bal.x*tk); qTilt.setFromEuler(eul);
      m.mesh.quaternion.copy(qTilt).multiply(qYaw);
      if(m.placed || m.t>0.9) ty=Math.max(ty, tmp.y+1.6*m.s*m.sy);
    }
    topY += (ty-topY)*Math.min(1,dt*2);

    if(G.state==='climb' && !G.desm){
      const st=C.steps[G.stepI];
      if(st.mem.every(m=>m.placed)){
        G.wait+=dt;
        if(st.enx){ G.state='aleta'; G.aPhase=0; G.aMiss=0; show('#btnAleta',1); msg("Fes l'aleta quan el cercle toqui el botó"); }
        else if(G.wait>0.35){ G.wait=0; G.stepI++; beginStep(G.stepI); }
      }
    }
    if(G.state==='aleta'){
      G.aPhase+=dt/1.25; if(G.aPhase>1){ G.aPhase=0; G.aMiss++; if(G.aMiss%2===0) kick(0.3); }
      const s=2.6-1.8*G.aPhase; const r=$('#aRing'); r.style.transform=`scale(${s.toFixed(3)})`; r.classList.toggle('zone',G.aPhase>0.79&&G.aPhase<0.985);
    }
    if(G.state==='carregat'){ G.wait-=dt; if(G.wait<=0){ hideStamp(); startDescent(); } }
    if(G.state==='descend'){
      const st=G.desc[G.descI];
      if(!st || st.mem.every(m=>!m.mesh.visible)){
        G.descI++;
        if(G.descI>=G.desc.length){
          const res = G.aleta ? 'D' : 'id';
          G.state='done'; stopToc(); playToc('final',false);
          if(res==='D'){ cheer(4); stamp('Descarregat!','#5fbf6a',`+${fmt(G.def.D)} punts`); vib([30,40,30]); }
          else stamp('Intent desmuntat','#c9bfae','sense punts');
          const tk=G.token; setTimeout(()=>{ if(tk===G.token) endRound(res); }, 2600);
        } else startDescStep();
      }
    }
  }

  // --- equilibrio ---
  const active = ['climb','aleta','carregat','descend'].includes(G.state);
  if(active){
    const d=G.def.diff*(G.easy?0.55:1), H=topY;
    const k=0.85*d*(0.3+H/12), na=0.75*d*(0.25+H/14);
    bal.gx += -bal.gx*1.3*dt + (Math.random()*2-1)*na*Math.sqrt(dt)*2.2;
    bal.gz += -bal.gz*1.3*dt + (Math.random()*2-1)*na*Math.sqrt(dt)*2.2;
    // entrada en espacio de cámara
    const ix=clamp(input.x+input.kx+input.tx,-1,1), iy=clamp(input.y+input.ky+input.ty,-1,1);
    const fx=-Math.sin(cam.theta), fz=-Math.cos(cam.theta), rx=Math.cos(cam.theta), rz=-Math.sin(cam.theta);
    const P=2.5;
    const ux=(rx*ix+fx*iy)*P, uz=(rz*ix+fz*iy)*P;
    bal.vx += (k*bal.x + bal.gx + ux - 1.7*bal.vx)*dt;
    bal.vz += (k*bal.z + bal.gz + uz - 1.7*bal.vz)*dt;
    bal.x += bal.vx*dt; bal.z += bal.vz*dt;
    if(Math.hypot(bal.x,bal.z)>1) fall();
  } else if(G.state!=='fall'){
    bal.x*=0.95; bal.z*=0.95; bal.vx=bal.vz=0;
    if(G.demo){ const t=G.T; bal.x=Math.sin(t*0.7)*0.06; bal.z=Math.cos(t*0.53)*0.05; }
  }
  // HUD de equilibrio
  { const fx=-Math.sin(cam.theta), fz=-Math.cos(cam.theta), rx=Math.cos(cam.theta), rz=-Math.sin(cam.theta);
    const sx=bal.x*rx+bal.z*rz, sy=-(bal.x*fx+bal.z*fz);
    const dot=$('#dot'); dot.style.transform=`translate(${(sx*55).toFixed(1)}px,${(sy*55).toFixed(1)}px)`;
    const l=Math.hypot(bal.x,bal.z); dot.style.background = l>0.7?'#ff4d4d':(l>0.45?'#ffa53a':'var(--groc)');
    const pl=$('#push'); const show_=l>0.12 && active;
    pl.style.opacity = show_?1:0;
    if(show_){ const k=Math.min(1,l)*34/l; pl.setAttribute('x2',(59-sx*k).toFixed(1)); pl.setAttribute('y2',(59-sy*k).toFixed(1)); }
    $('#level').classList.toggle('warn', active && l>0.7);
    if(active && l>0.75 && G.T-(G.lastBuzz||0)>0.45){ G.lastBuzz=G.T; vib(25); }
    // flecha 3D sobre el castell
    arrow.visible = show_ && G.state!=='fall';
    if(arrow.visible){ { const sw=sway(topY); arrow.position.set(bal.x*sw, topY+0.7, bal.z*sw); } arrow.rotation.y=Math.atan2(-bal.x,-bal.z);
      const s=0.6+Math.min(1,l)*1.1; arrow.scale.set(s,s,s); arrowMat.color.setHSL(0.33*(1-Math.min(1,l)),0.75,0.5).convertSRGBToLinear(); } }

  // --- caída ---
  if(G.state==='fall' || deb.length){
    G.fallT+=dt;
    for(const d of deb){
      if(d.rest) continue;
      const p=d.m.mesh.position; d.v.y-=9.8*0.75*dt; p.addScaledVector(d.v,dt);
      d.m.mesh.rotation.x+=d.w.x*dt; d.m.mesh.rotation.z+=d.w.z*dt;
      const floor = Math.hypot(p.x,p.z)<C.pinyaR ? 1.15+rand(0,.2) : 0;
      if(p.y<floor){ p.y=floor; d.v.multiplyScalar(0.25); d.v.y=Math.abs(d.v.y)*0.2; d.w.multiplyScalar(0.4); if(d.v.length()<0.3) d.rest=true; }
    }
  }

  // --- cámara ---
  const tTy = clamp(topY*0.52+0.8, 2.5, 9);
  const tDist = clamp(9.5+topY*1.0, 11, 23);
  cam.ty += (tTy-cam.ty)*Math.min(1,dt*1.5);
  cam.dist += (tDist-cam.dist)*Math.min(1,dt*1.2);
  if(!cam.drag) cam.theta += dt*(G.demo?0.09:0.035);
  const cd=cam.dist*Math.cos(cam.phi);
  camera.position.set(Math.sin(cam.theta)*cd, cam.ty+Math.sin(cam.phi)*cam.dist, Math.cos(cam.theta)*cd);
  if(shake>0){ shake-=dt; camera.position.x+=rand(-1,1)*shake*0.25; camera.position.y+=rand(-1,1)*shake*0.25; }
  camera.lookAt(0,cam.ty,0);
  sun.target.position.set(0,topY*0.4,0);
}

const arrowMat=new THREE.MeshBasicMaterial({color:0x5fbf6a, depthTest:false, transparent:true, opacity:0.9});
const arrow=new THREE.Group(); arrow.renderOrder=10;
{ const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.9,8),arrowMat); sh.rotation.x=Math.PI/2; sh.position.z=0.2; sh.renderOrder=10;
  const hd=new THREE.Mesh(new THREE.ConeGeometry(0.26,0.5,12),arrowMat); hd.rotation.x=Math.PI/2; hd.position.z=0.85; hd.renderOrder=10;
  arrow.add(sh,hd); arrow.visible=false; scene.add(arrow); }

const stick=$('#stick'), knob=$('#knob');
let stickId=null, so={x:0,y:0};
const playing=()=>['pinya','climb','aleta','carregat','descend'].includes(G.state);
function stickMove(e){
  let x=e.clientX-so.x, y=e.clientY-so.y; const l=Math.hypot(x,y), mx=52; if(l>mx){ x*=mx/l; y*=mx/l; }
  knob.style.transform=`translate(${x}px,${y}px)`; input.x=x/mx; input.y=-y/mx;
}
function stickUp(){ stickId=null; input.x=input.y=0; knob.style.transform=''; show('#stick',0); }
canvas.addEventListener('pointerdown',e=>{
  audioInit();
  // mitad inferior de la pantalla = equilibrio (si se juega con el dedo); el resto gira la cámara
  if(playing() && G.ctrl==='dit' && e.clientY>innerHeight*0.42 && stickId===null){
    stickId=e.pointerId; so={x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId);
    stick.style.left=so.x+'px'; stick.style.top=so.y+'px'; show('#stick',1); show('#zoneHint',0); stickMove(e); return;
  }
  if(!cam.drag){ cam.drag={x:e.clientX,y:e.clientY,id:e.pointerId}; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId===stickId){ stickMove(e); return; }
  if(!cam.drag||e.pointerId!==cam.drag.id) return;
  cam.theta-=(e.clientX-cam.drag.x)*0.006; cam.phi=clamp(cam.phi+(e.clientY-cam.drag.y)*0.004,0.05,0.95); cam.drag.x=e.clientX; cam.drag.y=e.clientY; });
const camUp=e=>{ if(e.pointerId===stickId){ stickUp(); return; } if(cam.drag&&e.pointerId===cam.drag.id) cam.drag=null; };

  catch(e){ return false; }
}

const keys={};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; updKeys();
  if(e.code==='Space'){ e.preventDefault(); doAleta(); } });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; updKeys(); });
function updKeys(){ input.kx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0); input.ky=(keys['arrowup']||keys['w']?1:0)-(keys['arrowdown']||keys['s']?1:0); }

$('#btnAleta').addEventListener('pointerdown',e=>{ e.preventDefault(); doAleta(); });
$('#btnDesm').addEventListener('click',()=>{ if(G.state==='climb'){ G.desm=true; show('#btnDesm',0); startDescent(); } });
$('#btnMute').addEventListener('click',()=>{ A.muted=!A.muted; if(A.master) A.master.gain.value=A.muted?0:0.55; $('#btnMute').textContent=A.muted?'∅':'♪'; });
$('#btnQuit').addEventListener('click',()=>{ stopToc(); titleScreen(); });

/* ================= SELLO ================= */
let stampT=null;
function stamp(t,col,sub){ const s=$('#stamp'); s.style.color=col; s.innerHTML=`${t}${sub?`<small>${sub}</small>`:''}`; s.classList.add('show'); clearTimeout(stampT); stampT=setTimeout(hideStamp,2400); }
function hideStamp(){ $('#stamp').classList.remove('show'); }

/* ================= PANTALLAS ================= */
const scr=$('#screen');
function setScreen(html, dim=true){ scr.className=dim?'dim':''; scr.innerHTML=html; scr.scrollTop=0; }
function hud(on){ show('#hud',on); show('#topBtns',on); show('#level',on); if(!on){ show('#zoneHint',0); show('#stick',0); stickUp(); } show('#actions',on); }

function titleScreen(){
  hud(0); G.state='idle'; G.demo=true; deb.length=0; G.token=(G.token||0)+1; hideStamp();
  document.documentElement.style.setProperty('--colla', G.colla.color);
  buildCastell(byId('3d9f'), G.colla); C.form=0;
  C.all.forEach(m=>{ m.placed=true; m.t=1; m.mesh.visible=true; makePath(m); setPose(m,m.pose); });
  setPose(C.enx,'aleta'); topY=C.yTop+1;
  setScreen(`<div class="wrap" style="display:flex;flex-direction:column;min-height:100%">
    <h1 class="title">Castells</h1>
    <p class="motto">Força, equilibri, valor i seny. Aixeca la torre, corona-la amb l'aleta i descarrega-la sencera.</p>
    <div class="spacer"></div>
    <div class="btns">
      <button class="b1" data-a="diada">Fer una diada de concurs</button>
      <button class="b2" data-a="assaig">Assaig lliure</button>
      <button class="b2" data-a="guia">Guia castellera</button>
    </div>
    ${store.best?`<p class="lead" style="margin-top:14px">Rècord de diada: ${fmt(store.best)} punts</p>`:''}
  </div>`, false);
  scr.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ audioInit(); const a=b.dataset.a;
    if(a==='guia') guideScreen(); else { G.mode=a; collaScreen(); } });
}

function collaScreen(){
  setScreen(`<div class="wrap"><button class="back" data-back>‹ Tornar</button>
    <div class="panel"><h2>Tria la colla</h2>
    <p class="lead">Les camises identifiquen cada colla. Els colors són aproximats.</p>
    <div class="colles">${COLLES.map(c=>`<button class="colla" data-c="${c.id}" aria-pressed="${c.id===G.colla.id}"><span class="sw" style="background:${c.color}"></span><b>${c.name}</b></button>`).join('')}</div>
    <h3>Dificultat</h3>
    <div class="toggle"><button data-e="1" aria-pressed="${G.easy}">Plaça amable</button><button data-e="0" aria-pressed="${!G.easy}">Concurs real</button></div>
    <h3>Control</h3>
    <div class="toggle"><button data-k="dit" aria-pressed="${G.ctrl==='dit'}">Polze</button><button data-k="incl" aria-pressed="${G.ctrl==='incl'}">Inclinar el mòbil</button></div>
    <p class="lead" style="font-size:13px;margin-top:8px">${G.ctrl==='dit'?"El joystick apareix on toques, a la meitat inferior. L'indicador d'equilibri queda a dalt a l'esquerra, sempre a la vista.":"Inclina el mòbil cap on indica la fletxa verda. La posició inicial es calibra en començar cada castell."}</p>
    <div class="btns"><button class="b1" data-go>Continuar</button></div></div></div>`);
  scr.querySelector('[data-back]').onclick=titleScreen;
  scr.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ G.colla=COLLES.find(c=>c.id===b.dataset.c); collaScreen(); buildDemoColor(); });
  scr.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ G.easy=b.dataset.e==='1'; collaScreen(); });
  scr.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{ let k=b.dataset.k;
    if(k==='incl' && !(await askTilt())){ k='dit'; alert("Aquest dispositiu no dona accés a la inclinació. Es fa servir el polze."); }
    G.ctrl=k; store.ctrl=k; save(); collaScreen(); });
  scr.querySelector('[data-go]').onclick=()=>{ if(G.mode==='diada'){ G.results=[]; G.ronda=1; } castellScreen(); };
}
function buildDemoColor(){ if(!G.demo) return; const keep=scr.innerHTML; buildCastell(byId('3d9f'),G.colla); C.form=0;
  C.all.forEach(m=>{ m.placed=true; m.t=1; m.mesh.visible=true; makePath(m); setPose(m,m.pose); }); setPose(C.enx,'aleta'); document.documentElement.style.setProperty('--colla', G.colla.color); }

function diffDots(d){ const n=clamp(Math.round((d-0.6)/0.34)+1,1,5); return `<span class="diff">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`; }
function castellScreen(){
  const descarregats = new Set(G.results.filter(r=>r.res==='D').map(r=>r.id));
  const groups=[['De 6 i 7 pisos',c=>c.pisos<=7],['De 8 pisos',c=>c.pisos===8],['De 9 pisos',c=>c.pisos===9],['De 10 pisos',c=>c.pisos===10]];
  const head = G.mode==='diada'
    ? `<h2>Ronda ${G.ronda}</h2><p class="lead">Tens fins a 5 rondes per sumar tres castells. Puntuen els tres millors d'estructura diferent, amb un màxim de dos només carregats. Punts actuals: <b>${fmt(score(G.results).total)}</b></p>`
    : `<h2>Tria el castell</h2><p class="lead">Punts de la taula del Concurs 2026: carregat i descarregat.</p>`;
  setScreen(`<div class="wrap"><button class="back" data-back>‹ ${G.mode==='diada'&&G.results.length?'Acabar la diada':'Tornar'}</button>
    <div class="panel">${head}
    ${groups.map(([t,f])=>`<h3>${t}</h3><div class="glist">${CASTELLS.filter(f).map(c=>`
      <button class="cs" data-id="${c.id}" ${G.mode==='diada'&&descarregats.has(c.id)?'disabled':''}>
        <span class="nm">${c.name}</span><span class="cd">${c.id}</span>
        <span class="pt">C ${fmt(c.C)} / D ${fmt(c.D)}</span>${diffDots(c.diff)}
      </button>`).join('')}</div>`).join('')}
    </div></div>`);
  scr.querySelector('[data-back]').onclick=()=>{ if(G.mode==='diada'&&G.results.length) summaryScreen(); else collaScreen(); };
  scr.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>startCastell(byId(b.dataset.id)));
}

function roundScreen(r){
  const sc=score(G.results); const ok=G.results.filter(x=>x.res==='D'||x.res==='C');
  const distinct=new Set(ok.map(x=>x.id)).size;
  const end = G.ronda>=5 || (sc.chosen.length>=3 && distinct>=3 && G.ronda>=3);
  setScreen(`<div class="wrap"><div class="spacer"></div><div class="panel">
    <p class="dim-t" style="margin:0">Ronda ${G.ronda}: ${G.def.name}</p>
    <div class="res" style="color:${RESCOL[r.res]}">${RESNAME[r.res]}</div>
    <p class="lead">Notació: <b>${notation(r)}</b>${r.res==='D'?` · ${fmt(G.def.D)} punts`:r.res==='C'?` · ${fmt(G.def.C)} punts si entra entre els tres millors`:''}</p>
    <table class="sum">${G.results.map((x,i)=>`<tr><td>R${i+1} ${notation(x)}</td><td style="color:${RESCOL[x.res]}">${RESNAME[x.res]}</td></tr>`).join('')}
    <tr><td>Total provisional</td><td>${fmt(sc.total)}</td></tr></table>
    <div class="btns">${end?`<button class="b1" data-sum>Veure la classificació</button>`:`<button class="b1" data-next>Següent ronda</button><button class="b2" data-sum>Acabar la diada</button>`}</div>
  </div></div>`);
  const n=scr.querySelector('[data-next]'); if(n) n.onclick=()=>{ G.ronda++; castellScreen(); };
  scr.querySelector('[data-sum]').onclick=summaryScreen;
}
function summaryScreen(){
  const sc=score(G.results);
  const rec = !store.best || sc.total>store.best; if(rec && sc.total>0){ store.best=sc.total; save(); }
  hud(0);
  setScreen(`<div class="wrap"><div class="spacer"></div><div class="panel">
    <p class="dim-t" style="margin:0">${G.colla.name}</p>
    <h2>Actuació</h2>
    <p class="lead" style="font-size:18px;color:#fff">${G.results.map(notation).join(', ')||'Sense castells'}</p>
    <table class="sum">${sc.chosen.map(v=>`<tr><td>${byId(v.id).name} (${RESNAME[v.res].toLowerCase()})</td><td>${fmt(v.pts)}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td style="font-size:22px">${fmt(sc.total)}</td></tr></table>
    ${rec&&sc.total>0?`<p class="lead" style="color:var(--groc)">Nou rècord de diada!</p>`:''}
    <div class="btns"><button class="b1" data-new>Nova diada</button><button class="b2" data-menu>Menú</button></div>
  </div></div>`);
  scr.querySelector('[data-new]').onclick=()=>{ G.results=[]; G.ronda=1; G.mode='diada'; castellScreen(); };
  scr.querySelector('[data-menu]').onclick=titleScreen;
}
function practiceScreen(r){
  setScreen(`<div class="wrap"><div class="spacer"></div><div class="panel">
    <p class="dim-t" style="margin:0">${G.def.name}</p>
    <div class="res" style="color:${RESCOL[r.res]}">${RESNAME[r.res]}</div>
    <p class="lead">Notació: <b>${notation(r)}</b></p>
    <div class="btns"><button class="b1" data-rep>Tornar-ho a provar</button><button class="b2" data-other>Un altre castell</button><button class="b2" data-menu>Menú</button></div>
  </div></div>`);
  scr.querySelector('[data-rep]').onclick=()=>startCastell(G.def);
  scr.querySelector('[data-other]').onclick=castellScreen;
  scr.querySelector('[data-menu]').onclick=titleScreen;
}
function guideScreen(){
  setScreen(`<div class="wrap"><button class="back" data-back>‹ Tornar</button><div class="panel guide">
  <h2>Guia castellera</h2>
  <p>Un castell és una torre humana. Es nomena pel nombre de persones per pis i el total de pisos: un <b>3 de 9</b> té tres castellers a cada pis del tronc i nou pisos en total, comptant el pom de dalt.</p>
  <h3>Parts del castell</h3>
  <ul>
   <li><b>Pinya</b>: la base a terra. Aguanta el pes, corregeix desequilibris i esmorteeix les caigudes.</li>
   <li><b>Folre</b>: una segona pinya damunt de la primera, al nivell dels segons, que subjecta els terços.</li>
   <li><b>Manilles</b>: tercera pinya, sobre el folre, que subjecta els quarts. Els <b>puntals</b> van encara un pis més amunt, al pilar de 9.</li>
   <li><b>Tronc</b>: baixos, segons, terços, quarts… Els segons han de ser forts; com més amunt, més lleugers.</li>
   <li><b>Pom de dalt</b>: la canalla amb casc. Dosos, acotxador (o aixecador) i enxaneta.</li>
  </ul>
  <h3>Resultats</h3>
  <ul>
   <li><b>Carregat</b>: l'enxaneta corona i fa l'aleta, alçant la mà.</li>
   <li><b>Descarregat</b>: a més, tots baixen ordenadament sense que caigui.</li>
   <li><b>Intent</b>: cau abans de l'aleta. <b>Intent desmuntat</b>: es desfà de manera controlada abans de coronar.</li>
  </ul>
  <h3>Notació</h3>
  <p><b>f</b> amb folre, <b>m</b> manilles, <b>p</b> puntals, <b>a</b> amb l'agulla (un pilar dins del castell), <b>sf</b> sense folre, <b>sm</b> sense manilles. Pilar = <b>P</b>, torre = <b>2</b>. Prefix <b>i</b> per intent, <b>id</b> per intent desmuntat, sufix <b>C</b> per carregat.</p>
  <h3>Concurs de Castells</h3>
  <p>Biennal, a la Tarraco Arena de Tarragona, el primer cap de setmana d'octubre. Hi participen les 42 millors colles del Rànquing Estrella. La classificació suma els tres millors castells d'estructura diferent; amb la normativa del 2026 només hi compten, com a màxim, dos castells carregats. Els punts d'aquest joc són els de la taula del 2026.</p>
  <h3>Indumentària i música</h3>
  <p>Camisa del color de la colla, pantaló blanc, <b>faixa</b> negra que protegeix l'esquena i serveix d'agafador, i mocador. Al tronc, al folre i a les manilles es va descalç; a la pinya, calçat. La canalla porta casc. Les <b>gralles</b> i els timbals toquen el toc de castells mentre el castell s'aixeca.</p>
  <h3>Com es juga</h3>
  <p>Posa el polze a la meitat inferior i arrossega cap on indica la fletxa verda (a l'indicador de dalt i també sobre el castell) perquè el punt groc no surti de la línia vermella. També pots triar jugar inclinant el mòbil. Quan l'enxaneta arribi dalt, toca <b>Aleta!</b> quan l'anell blanc tanqui sobre el botó. Després, aguanta l'equilibri fins que tothom hagi baixat. Pots arrossegar l'escena per girar la càmera i, si veus que no surt, desmuntar a temps.</p>
  </div></div>`);
  scr.querySelector('[data-back]').onclick=titleScreen;
}

titleScreen();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
